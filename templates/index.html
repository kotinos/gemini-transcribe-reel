<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcribe Reel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: #333;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-family: inherit;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        select {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-family: inherit;
            background-color: white;
        }

        select:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            color: #6c757d;
            margin-top: 1rem;
            font-size: 0.95rem;
        }
        
        .error {
            color: #dc3545;
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #f8d7da;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        
        .result {
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f9fa;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.95rem;
            user-select: text;
        }
        
        .batch-result {
            margin-top: 0.5rem;
            padding: 0.75rem;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            background-color: #fff;
        }
        
        .batch-result-header {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .batch-result-success {
            border-left: 3px solid #28a745;
        }
        
        .batch-result-failed {
            border-left: 3px solid #dc3545;
        }
        
        .batch-result-failed .batch-result-header {
            color: #dc3545;
        }
        
        .batch-summary {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #e9ecef;
            border-radius: 4px;
            font-weight: 600;
            text-align: center;
        }
        
        .hidden {
            display: none;
        }

        .script-library {
            margin-top: 2rem;
            border-top: 1px solid #dee2e6;
            padding-top: 1rem;
        }

        .script-library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }

        .script-library-header h3 {
            font-size: 1rem;
            color: #333;
        }

        .script-card {
            margin-top: 0.5rem;
            padding: 0.75rem;
            border: 1px solid #dee2e6;
            border-left: 3px solid #007bff;
            border-radius: 4px;
            background-color: #fff;
        }

        .script-card-url {
            font-weight: 600;
            color: #495057;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            word-break: break-all;
        }

        .script-card-time {
            font-size: 0.75rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }

        .script-card-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .script-card-text.preview {
            max-height: 3rem;
            overflow: hidden;
        }

        .script-card-actions {
            margin-top: 0.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .script-card-actions button {
            width: auto;
            padding: 0.25rem 0.75rem;
            font-size: 0.85rem;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #545b62;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #c82333;
        }

        .btn-success {
            background-color: #28a745;
        }

        .btn-success:hover:not(:disabled) {
            background-color: #218838;
        }

        .script-edit-area {
            width: 100%;
            min-height: 100px;
            padding: 0.5rem;
            font-size: 0.9rem;
            font-family: inherit;
            border: 1px solid #007bff;
            border-radius: 4px;
            resize: vertical;
        }

        .empty-state {
            color: #6c757d;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <label for="url-input">Paste Reel URL</label>
    <input 
        type="text" 
        id="url-input" 
        placeholder="https://instagram.com/p/..." 
        autocomplete="off"
    >
    
    <label for="batch-input">Or Paste Multiple URLs (one per line)</label>
    <textarea 
        id="batch-input" 
        placeholder="https://instagram.com/p/...&#10;https://tiktok.com/@user/video/...&#10;https://facebook.com/watch/..."
    ></textarea>
    
    <label for="model-select">Model</label>
    <select id="model-select">
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
    </select>

    <button id="transcribe-btn">Transcribe</button>
    
    <div id="loading" class="loading hidden">Transcribing…</div>
    <div id="error" class="error hidden"></div>
    <div id="result" class="result hidden"></div>

    <div class="script-library" id="script-library">
        <div class="script-library-header" onclick="toggleLibrary()">
            <h3>Saved Scripts <span id="script-count"></span></h3>
            <span id="toggle-arrow">▼</span>
        </div>
        <div id="script-list"></div>
    </div>
    
    <script>
        const urlInput = document.getElementById('url-input');
        const batchInput = document.getElementById('batch-input');
        const modelSelect = document.getElementById('model-select');
        const transcribeBtn = document.getElementById('transcribe-btn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');
        
        function showLoading() {
            transcribeBtn.disabled = true;
            transcribeBtn.textContent = 'Transcribing…';
            loading.classList.remove('hidden');
            error.classList.add('hidden');
            result.classList.add('hidden');
        }
        
        function hideLoading() {
            transcribeBtn.disabled = false;
            transcribeBtn.textContent = 'Transcribe';
            loading.classList.add('hidden');
        }
        
        function showError(message) {
            error.textContent = message;
            error.classList.remove('hidden');
            result.classList.add('hidden');
        }
        
        function showResult(text, url) {
            result.innerHTML = '';
            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            textDiv.style.whiteSpace = 'pre-wrap';
            textDiv.style.wordWrap = 'break-word';
            result.appendChild(textDiv);
            if (url) {
                const regenBtn = document.createElement('button');
                regenBtn.className = 'btn-secondary';
                regenBtn.textContent = 'Regenerate';
                regenBtn.style.marginTop = '0.5rem';
                regenBtn.addEventListener('click', () => regenerate(url, textDiv, regenBtn));
                result.appendChild(regenBtn);
            }
            result.classList.remove('hidden');
            error.classList.add('hidden');
        }
        
        function showBatchResults(results) {
            const successCount = results.filter(r => r.success).length;
            const total = results.length;
            
            result.innerHTML = '';
            
            // Add summary
            const summary = document.createElement('div');
            summary.className = 'batch-summary';
            summary.textContent = `BATCH RESULTS: ${successCount}/${total} successful`;
            result.appendChild(summary);
            
            // Add individual results
            results.forEach((item, index) => {
                const resultDiv = document.createElement('div');
                resultDiv.className = `batch-result ${item.success ? 'batch-result-success' : 'batch-result-failed'}`;
                
                const header = document.createElement('div');
                header.className = 'batch-result-header';
                header.textContent = `[${index + 1}] ${item.url}`;
                resultDiv.appendChild(header);
                
                const content = document.createElement('div');
                content.textContent = item.success ? item.transcription : '(FAILED)';
                content.style.whiteSpace = 'pre-wrap';
                content.style.wordWrap = 'break-word';
                resultDiv.appendChild(content);

                const regenBtn = document.createElement('button');
                regenBtn.className = 'btn-secondary';
                regenBtn.textContent = 'Regenerate';
                regenBtn.style.marginTop = '0.5rem';
                regenBtn.style.width = 'auto';
                regenBtn.style.padding = '0.25rem 0.75rem';
                regenBtn.style.fontSize = '0.85rem';
                regenBtn.addEventListener('click', () => regenerate(item.url, content, regenBtn));
                resultDiv.appendChild(regenBtn);
                
                result.appendChild(resultDiv);
            });
            
            result.classList.remove('hidden');
            error.classList.add('hidden');
        }
        
        async function transcribe() {
            const singleUrl = urlInput.value.trim();
            const batchUrls = batchInput.value.trim();
            
            // Determine if single or batch
            let urls = [];
            if (singleUrl && !batchUrls) {
                urls = [singleUrl];
            } else if (batchUrls) {
                urls = batchUrls.split('\n')
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('#'));
            }
            
            if (urls.length === 0) {
                showError('ERROR: Please paste at least one URL');
                return;
            }
            
            showLoading();
            
            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ urls: urls, model: modelSelect.value })
                });
                
                const data = await response.json();
                
                hideLoading();
                
                if (data.success) {
                    if (data.results) {
                        // Batch results
                        showBatchResults(data.results);
                    } else {
                        // Single result
                        showResult(data.transcription, urls[0]);
                    }
                    loadScripts();
                } else {
                    showError(data.error || 'ERROR: Transcription failed');
                }
            } catch (err) {
                hideLoading();
                showError('ERROR: Network error. Please check your connection.');
            }
        }
        
        transcribeBtn.addEventListener('click', transcribe);
        
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                transcribe();
            }
        });
        
        // Clear batch input when typing in single URL field
        urlInput.addEventListener('input', () => {
            if (urlInput.value.trim()) {
                batchInput.value = '';
            }
        });
        
        // Clear single input when typing in batch field
        batchInput.addEventListener('input', () => {
            if (batchInput.value.trim()) {
                urlInput.value = '';
            }
        });
        
        // Fetch available models on page load
        async function loadModels() {
            try {
                const response = await fetch('/models');
                const data = await response.json();
                if (data.models && data.models.length > 0) {
                    modelSelect.innerHTML = '';
                    data.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        modelSelect.appendChild(option);
                    });
                }
            } catch (err) {
                // Keep default option on error
            }
        }
        loadModels();

        // Regenerate function
        async function regenerate(url, contentEl, btn) {
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Regenerating\u2026';
            try {
                const response = await fetch('/regenerate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, model: modelSelect.value })
                });
                const data = await response.json();
                if (data.success) {
                    contentEl.textContent = data.transcription;
                    loadScripts();
                } else {
                    contentEl.textContent = contentEl.textContent + '\n\n[Regeneration failed: ' + (data.error || 'Unknown error') + ']';
                }
            } catch (err) {
                contentEl.textContent = contentEl.textContent + '\n\n[Regeneration failed: Network error]';
            }
            btn.disabled = false;
            btn.textContent = originalText;
        }

        // Script library
        const scriptList = document.getElementById('script-list');
        const scriptCount = document.getElementById('script-count');
        const toggleArrow = document.getElementById('toggle-arrow');
        let libraryOpen = true;

        function toggleLibrary() {
            libraryOpen = !libraryOpen;
            scriptList.style.display = libraryOpen ? 'block' : 'none';
            toggleArrow.textContent = libraryOpen ? '\u25bc' : '\u25b6';
        }

        async function loadScripts() {
            try {
                const response = await fetch('/scripts');
                const scripts = await response.json();
                scriptCount.textContent = `(${scripts.length})`;
                scriptList.innerHTML = '';
                if (scripts.length === 0) {
                    scriptList.innerHTML = '<div class="empty-state">No saved scripts yet</div>';
                    return;
                }
                scripts.forEach(script => {
                    scriptList.appendChild(createScriptCard(script));
                });
            } catch (err) {
                scriptList.innerHTML = '<div class="empty-state">Could not load scripts</div>';
            }
        }

        function createScriptCard(script) {
            const card = document.createElement('div');
            card.className = 'script-card';
            card.dataset.id = script.id;

            const url = document.createElement('div');
            url.className = 'script-card-url';
            url.textContent = script.url;
            card.appendChild(url);

            const time = document.createElement('div');
            time.className = 'script-card-time';
            time.textContent = script.updated_at;
            card.appendChild(time);

            const text = document.createElement('div');
            text.className = 'script-card-text preview';
            text.textContent = script.transcription;
            text.addEventListener('click', () => {
                text.classList.toggle('preview');
            });
            card.appendChild(text);

            const actions = document.createElement('div');
            actions.className = 'script-card-actions';

            const editBtn = document.createElement('button');
            editBtn.className = 'btn-secondary';
            editBtn.textContent = 'Edit';
            editBtn.addEventListener('click', () => enterEditMode(card, script));
            actions.appendChild(editBtn);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-danger';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', () => deleteScriptCard(script.id, card));
            actions.appendChild(deleteBtn);

            card.appendChild(actions);
            return card;
        }

        function enterEditMode(card, script) {
            const textEl = card.querySelector('.script-card-text');
            const actionsEl = card.querySelector('.script-card-actions');
            const original = script.transcription;

            const textarea = document.createElement('textarea');
            textarea.className = 'script-edit-area';
            textarea.value = textEl.textContent;
            textEl.replaceWith(textarea);

            actionsEl.innerHTML = '';
            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn-success';
            saveBtn.textContent = 'Save';
            saveBtn.addEventListener('click', async () => {
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving\u2026';
                try {
                    const res = await fetch(`/scripts/${script.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ transcription: textarea.value })
                    });
                    if (res.ok) {
                        const updated = await res.json();
                        script.transcription = updated.transcription;
                        loadScripts();
                    }
                } catch (err) { /* keep edit mode */ }
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save';
            });
            actionsEl.appendChild(saveBtn);

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-secondary';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', () => loadScripts());
            actionsEl.appendChild(cancelBtn);
        }

        async function deleteScriptCard(id, card) {
            try {
                const res = await fetch(`/scripts/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    card.remove();
                    loadScripts();
                }
            } catch (err) { /* ignore */ }
        }

        loadScripts();

        // Focus input on load
        urlInput.focus();
    </script>
</body>
</html>
